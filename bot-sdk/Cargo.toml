[package]
name = "dioxusfun-bot"
version = "0.1.0"
edition = "2024"
description = "Async client SDK for writing dioxusfun bots (Tier 1 external bots, over WebSocket or QUIC)."

[dependencies]
dioxusfun-protocol = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = { workspace = true }
# A host off loopback answers only QUIC, keyed to its share string (trap 15).
iroh = { workspace = true }
futures-util = { workspace = true }
secp256k1 = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
bs58 = { workspace = true }
serde_json = { workspace = true }
url = "2"
rand = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
