[workspace]
resolver = "2"
members = ["client", "server", "rendezvous", "grid-layout"]

# Shared dep versions — each member opts in with `{ workspace = true }` and
# inherits version + default features from here. Add per-member features
# at the member's Cargo.toml as needed.
[workspace.dependencies]
# Inter-crate path deps.
dioxusfun-server = { path = "server" }

# Common third-party deps used by ≥2 crates.
dioxus = "0.7"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1" }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
bs58 = "0.5"
