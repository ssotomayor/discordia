[workspace]
resolver = "2"
members = ["client", "server", "rendezvous", "grid-layout", "protocol", "bot-sdk"]

# Shared dep versions — each member opts in with `{ workspace = true }` and
# inherits version + default features from here. Add per-member features
# at the member's Cargo.toml as needed.
[workspace.dependencies]
# Inter-crate path deps.
dioxusfun-server = { path = "server" }
dioxusfun-protocol = { path = "protocol" }

# Common third-party deps used by ≥2 crates.
dioxus = "0.7"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1" }
tokio-tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bs58 = "0.5"
# Nostr identity: secp256k1 Schnorr (BIP-340) keys; NIP-06 derivation is done
# in client/src/identity.rs on top of this. `hex` for wire encoding of
# pubkeys/signatures.
secp256k1 = { version = "0.29", default-features = false, features = ["std", "rand-std"] }
hex = "0.4"

# QUIC transport for the direct/private path (roadmap Stage 2, docs/NETWORKING.md).
# Authentication is by public key by construction, which is the whole argument
# for it over a self-signed TLS certificate and a hand-rolled verifier. Both the
# gateway (accept) and the client (dial) need it.
iroh = "1.0"

# --- DeepFilterNet / tract inference stack ----------------------------------
# Two reasons this can't run as a plain debug build (see client/src/denoise.rs):
#
#  1. Correctness. `tract-core` runs an internal self-consistency check after
#     graph compaction, but only under `cfg(debug_assertions)`. DeepFilterNet 3's
#     graph trips it ("duplicate name /convt3/Conv.bias") even though inference
#     is perfectly fine — so in an unmodified dev build the model simply refuses
#     to load and noise cancellation is unavailable under `cargo run`/`dx serve`.
#  2. Speed. Unoptimised tract is orders of magnitude slower than the ~150µs per
#     10ms hop the release build manages; it cannot keep up with realtime audio.
#
# Optimising just these packages costs a one-time compile and leaves the rest of
# the workspace debuggable as usual.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
