[workspace]
resolver = "2"
members = ["client", "server", "rendezvous", "grid-layout", "protocol", "bot-sdk"]

[workspace.dependencies]
dioxusfun-server = { path = "server" }
dioxusfun-protocol = { path = "protocol" }

dioxus = "0.7"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1" }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bs58 = "0.5"
secp256k1 = { version = "0.29", default-features = false, features = ["std", "rand-std"] }
hex = "0.4"

iroh = "1.0"
iroh-relay = { version = "1.0", default-features = false, features = ["server"] }

# Unoptimised tract fails its own self-consistency check and is orders of
# magnitude slower — the DeepFilterNet model will not load without these.
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false

[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
