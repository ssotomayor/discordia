[application]
name = "Discordia"
android_main_activity = "android/MainActivity.kt"

[web.app]
title = "Discordia"

[desktop]
enable_dev_tools = true

[android]
min_sdk = 26
target_sdk = 34
compile_sdk = 34
foreground_service_types = ["microphone", "camera", "mediaProjection"]

[android.permissions."android.permission.RECORD_AUDIO"]
description = "Voice calls and microphone testing"

[android.permissions."android.permission.CAMERA"]
description = "Camera preview and video in calls"

[android.permissions."android.permission.MODIFY_AUDIO_SETTINGS"]
description = "Voice audio routing and volume"

[android.permissions."android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"]
description = "Sharing your screen from a foreground service"

[android.permissions."android.permission.FOREGROUND_SERVICE_MICROPHONE"]
description = "Keeping an active voice call in the background"

[android.permissions."android.permission.FOREGROUND_SERVICE_CAMERA"]
description = "Keeping an active video call in the background"

[android.permissions."android.permission.WAKE_LOCK"]
description = "Keeping call media running while the screen is off"

[android.permissions."android.permission.ACCESS_NETWORK_STATE"]
description = "Updating active connections when Android changes networks"

[android.permissions."android.permission.REQUEST_INSTALL_PACKAGES"]
description = "Installing verified Discordia updates with your confirmation"

[ios]
deployment_target = "16.0"
info_plist = "Info.plist"

[bundle]
display_name = "Discordia"
identifier = "com.discordia.app"
publisher = "TehSoTo"
short_description = "Discordia"
original_file_name = "Discordia.exe"
icon = ["assets/icon.ico", "assets/icon.icns", "assets/icon-1024.png"]

[bundle.macos]
info_plist_path = "Info.plist"

[bundle.windows]
internal_name = "Discordia"
webview_install_mode = "Skip"

[bundle.windows.nsis]
installer_hooks = "nsis/hooks.nsh"
installer_icon = "assets/icon.ico"
