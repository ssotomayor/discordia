[application]
name = "Discordia"

[web.app]
title = "Discordia"

[desktop]
enable_dev_tools = true

[bundle]
display_name = "Discordia"
identifier = "com.discordia.app"
publisher = "TehSoTo"
# App icon: ico for Windows, icns for macOS, png fallback for other bundlers.
#
# The .ico is not optional dressing — the CLI embeds the FIRST `.ico` in this
# list into the executable's resources, and with none listed it falls back to
# its own bundled icon, which is the Dioxus logo. That is what shipped: the
# generated .winres/icon.ico was byte-identical to the CLI's default.
#
# Regenerate all three from assets/icon.svg when the logo changes:
#   resvg --width N --height N assets/icon.svg out-N.png     (N = 16..256, 1024)
#   .ico  = those sizes combined (16/24/32/48/64/128/256)
#   .icns = macOS, via qlmanage → sips → iconutil
# Render each .ico size from the SVG rather than downscaling the 1024 — the
# 16px entry is what Windows shows in the taskbar, and it needs the hinting.
icon = ["assets/icon.ico", "assets/icon.icns", "assets/icon-1024.png"]

# WebView2 is handled by the app, not by the bundler — see `nsis.installer_hooks`
# below and `client/src/webview2.rs`.
#
# "Skip" is load-bearing, not a way of ignoring the problem. Left at its default
# the CLI uses `OfflineInstaller`, which downloads the FULL runtime (~130MB) and
# embeds it in the setup — that alone was the bulk of the installer. The other
# modes embed the ~2MB Evergreen bootstrapper but emit their own NSIS snippet
# that runs it *unconditionally*, and that snippet cannot be guarded: dx writes
# it inline in the install section, while `installer_hooks` is only `!include`d
# after that section closes. Skipping it is what lets the check happen first.
[bundle.windows]
webview_install_mode = "Skip"

[bundle.windows.nsis]
# Runs the freshly installed binary as `Discordia.exe --ensure-webview2`, so the
# installer and the portable zip share one implementation of "is the runtime
# here, and install it if not" instead of keeping a second copy in NSIS script.
installer_hooks = "nsis/webview2.nsh"
# The installer window and its Add/Remove Programs entry draw their own icon,
# which NSIS defaults to its own artwork unless told otherwise.
installer_icon = "assets/icon.ico"
