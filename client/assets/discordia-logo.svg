<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Vector recreation of the uploaded logo">
  <defs>
    <linearGradient id="yellowGrad" x1="250" y1="325" x2="565" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd21a"/>
      <stop offset="0.45" stop-color="#ffdb24"/>
      <stop offset="1" stop-color="#ffc400"/>
    </linearGradient>
    <radialGradient id="darkGrad" cx="610" cy="445" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2d303c"/>
      <stop offset="0.65" stop-color="#242733"/>
      <stop offset="1" stop-color="#181b25"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Left yellow portion -->
    <path d="M315 301
             C253 354 223 428 230 507
             C237 598 288 684 370 727
             C421 754 481 766 553 761
             L455 659
             L499 609
             L376 530
             L445 434
             Z"
          fill="url(#yellowGrad)"/>

    <!-- Right dark portion -->
    <path d="M326 278
             C420 218 553 205 657 245
             C752 282 814 366 828 467
             C842 570 801 667 724 719
             C686 745 639 759 584 758
             L503 661
             L558 602
             L432 530
             L490 434
             Z"
          fill="url(#darkGrad)" stroke="#11141c" stroke-width="2"/>

    <!-- Dark separator/bite shadow -->
    <path d="M323 278 L490 434 L432 530 L558 602 L503 661 L584 758"
          fill="none" stroke="#050608" stroke-width="18" stroke-linejoin="miter" stroke-linecap="butt" opacity="0.92"/>

    <!-- Repaint the dark face after separator so the edge remains crisp -->
    <path d="M326 278
             C420 218 553 205 657 245
             C752 282 814 366 828 467
             C842 570 801 667 724 719
             C686 745 639 759 584 758
             L503 661
             L558 602
             L432 530
             L490 434
             Z"
          fill="url(#darkGrad)" stroke="#11141c" stroke-width="2"/>

    <!-- Yellow vertical pill -->
    <rect x="588" y="395" width="70" height="164" rx="35" ry="35"
          fill="url(#yellowGrad)" stroke="#050608" stroke-width="2"/>
  </g>
</svg>
