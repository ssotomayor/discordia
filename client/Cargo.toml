[package]
name = "dioxusfun"
version = "0.1.0"
edition = "2024"

[dependencies]
# Dioxus-specific deps (not shared with server/rendezvous, no need to hoist).
dioxus = "0.7"
tokio-tungstenite = { workspace = true }
url = "2"

# Voice: livekit Rust SDK (wraps libwebrtc via webrtc-sys) + cpal for native
# audio device I/O. First build downloads ~50MB of precompiled libwebrtc.
livekit = "0.7"
cpal = "0.15"
parking_lot = "0.12"
async-trait = "0.1"
local-ip-address = "0.6"
reqwest = { workspace = true }
# Crypto identity: Nostr secp256k1/Schnorr keypair derived from a BIP39
# mnemonic via NIP-06 (see src/identity.rs). `bech32` for npub/nsec, `hex`
# for wire encoding.
secp256k1 = { workspace = true }
hex = { workspace = true }
bech32 = "0.11"
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"
dirs = "5"
rand = "0.8"

# base64 for inline image / avatar data URLs (chat + profiles).
base64 = "0.22"

# Shared wire protocol (client, server, bot SDK all depend on this one crate).
dioxusfun-protocol = { workspace = true }
# Self-host mode: embed the gateway server in-process.
dioxusfun-server = { workspace = true }
dioxus-grid-layout = { path = "../grid-layout" }

# Shared deps inherited from workspace.
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures-util = { workspace = true }
tracing = { workspace = true }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

# The executable (and therefore the .app / installer name) is "Discordia";
# the crate keeps its workspace name.
[[bin]]
name = "Discordia"
path = "src/main.rs"
