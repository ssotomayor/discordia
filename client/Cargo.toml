[package]
name = "dioxusfun"
version = "0.1.0"
edition = "2024"

[dependencies]
# Dioxus-specific deps (not shared with server/rendezvous, no need to hoist).
dioxus = "0.7"
tokio-tungstenite = { workspace = true }
url = "2"

# Voice: livekit Rust SDK (wraps libwebrtc via webrtc-sys) + cpal for native
# audio device I/O. First build downloads ~50MB of precompiled libwebrtc.
livekit = "0.7"
cpal = "0.15"
parking_lot = "0.12"
local-ip-address = "0.6"
reqwest = { workspace = true }
# Crypto identity: Nostr secp256k1/Schnorr keypair derived from a BIP39
# mnemonic via NIP-06 (see src/identity.rs). `bech32` for npub/nsec, `hex`
# for wire encoding.
secp256k1 = { workspace = true }
hex = { workspace = true }
bech32 = "0.11"
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"
dirs = "5"
rand = "0.8"

# base64 for inline image / avatar data URLs (chat + profiles).
base64 = "0.22"

# Decodes the app icon PNG into RGBA for the native window icon (taskbar).
image = { version = "0.25", default-features = false, features = ["png"] }

# Microphone noise suppression: DeepFilterNet 3 running on the `tract` pure-Rust
# inference engine, with the network weights compiled in (`default-model`). See
# `src/denoise.rs` for why this model/runtime pair and what it costs.
#
# Pinned to a git rev because crates.io only carries deep_filter 0.2.5, which
# predates the `tract` backend entirely. `default-features = false` drops the
# vorbis/flac decoders (dataset tooling we don't use).
#
# tract is pinned to =0.21.4 on purpose: DeepFilterNet's `^0.21.4` resolves to
# 0.21.17, where `Graph::symbol_table` moved and the crate no longer compiles.
# Bump these four together, and only after checking DeepFilterNet builds.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "d375b2d", default-features = false, features = ["tract", "default-model"] }
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
# Array views for handing hops to the DeepFilterNet model. Its API is built on
# ndarray 0.15, so this must track deep_filter's version, not the newest one.
ndarray = "0.15"

# High-quality audio resampler (FFT-based, pure Rust, no C deps). Replaces the
# naive linear-interpolation resampler that caused aliasing artefacts. Works on
# Windows (MSVC), macOS (Intel + Apple Silicon) and Linux.
rubato = "0.16"

# Shared wire protocol (client, server, bot SDK all depend on this one crate).
dioxusfun-protocol = { workspace = true }
# Self-host mode: embed the gateway server in-process.
dioxusfun-server = { workspace = true }
dioxus-grid-layout = { path = "../grid-layout" }

# Shared deps inherited from workspace.
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures-util = { workspace = true }
tracing = { workspace = true }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

# The executable (and therefore the .app / installer name) is "Discordia";
# the crate keeps its workspace name.
[[bin]]
name = "Discordia"
path = "src/main.rs"

# Native system-audio capture for screen sharing (see src/sysaudio/). macOS
# only for now: WebKit's getDisplayMedia is video-only, so a macOS share is
# silent unless we capture the machine's output ourselves. objc2 rather than the
# `screencapturekit` crate deliberately — that one builds a Swift component and
# would put the Swift runtime (plus an extra rpath) in the shipped app.
# Native system-audio capture on Windows: WASAPI *process* loopback, which is
# the only variant that can leave our own process tree out of the mix (see
# src/sysaudio/windows.rs). Version 0.61 deliberately: wry/webview2-com already
# pull that exact major, so this reuses the copy already in the tree instead of
# compiling a second one. `Wdk_System_SystemServices` is only for RtlGetVersion,
# which is how the build number is read honestly — see sysaudio::os_build.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # MessageBoxW, for the one error we cannot draw in our own UI: the missing
    # WebView2 runtime that would have drawn it (see src/webview2.rs).
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` macro expands to `::windows_core::…` paths, so the crate
# has to be nameable here even though every other reference goes through
# `windows::core`. Same version the `windows` crate itself pulls — two copies
# would make the generated impls fail to match the interface.
windows-core = "0.61"
# `GetAvailableCoreWebView2BrowserVersionString` — Microsoft's own "is a runtime
# available, and which" entry point. Already in the tree via wry, and it tracks
# the same windows-core 0.61, so this names a copy that is already compiled
# rather than adding one.
webview2-com-sys = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

# cargo-machete flags these as unused because nothing `use`s them by their
# package name. Both reasons are deliberate, so they're recorded here rather than
# rediscovered — deleting any of them breaks noise cancellation.
#
#  * deep_filter's library is named `df` (see `use df::tract::…` in denoise.rs),
#    which the scanner doesn't map back to the package name.
#  * The tract crates are declared purely to pin `=0.21.4`. DeepFilterNet asks
#    for `^0.21.4`, and on a newer tract the model does not load at all — see the
#    `[profile.dev.package]` comment in the workspace root.
[package.metadata.cargo-machete]
ignored = ["deep_filter", "tract-core", "tract-onnx", "tract-pulse", "tract-hir"]

