[package]
name = "dioxusfun"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/ssotomayor/discordia"

[dependencies]
dioxus = "0.7"
tokio-tungstenite = { workspace = true }
url = "2"

livekit = "0.7"
cpal = "0.15"
parking_lot = "0.12"
local-ip-address = "0.6"

igd-next = { version = "0.17", features = ["aio_tokio"] }
iroh = { workspace = true }
natpmp = { version = "0.5", default-features = false, features = ["tokio"] }
reqwest = { workspace = true }
secp256k1 = { workspace = true }
hex = { workspace = true }
bech32 = "0.11"
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
hkdf = "0.12"
dirs = "5"
rand = "0.8"

base64 = "0.22"

image = { version = "0.25", default-features = false, features = ["png"] }

deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "d375b2d", default-features = false, features = ["tract", "default-model"] }
# Pinned: DeepFilterNet asks for ^0.21.4 and the model does not load at all on
# a newer tract. See the [profile.dev.package] note in the workspace root.
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
ndarray = "0.15"

rubato = "0.16"

dioxusfun-protocol = { workspace = true }
dioxusfun-server = { workspace = true }
dioxus-grid-layout = { path = "../grid-layout" }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
minisign-verify = "0.2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[[bin]]
name = "Discordia"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
webview2-com-sys = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[package.metadata.cargo-machete]
ignored = ["deep_filter", "tract-core", "tract-onnx", "tract-pulse", "tract-hir"]

[dev-dependencies]
livekit-api = { version = "0.4", default-features = false, features = ["access-token"] }
uuid = { workspace = true }
