[package]
name = "dioxusfun"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/ssotomayor/discordia"

[dependencies]
dioxus = { workspace = true }
dioxus-desktop = { version = "=0.7.10", default-features = false, optional = true }
tokio-tungstenite = { workspace = true }
url = "2"

livekit = "=0.7.53"
# Later SDK dependency patches changed APIs without a semver break; keep the compatible set.
libwebrtc = "=0.3.42"
webrtc-sys = "=0.3.39"
livekit-common = "=0.1.0"
livekit-data-stream = "=0.1.0"
livekit-protocol = "=0.7.10"
livekit-datatrack = "=0.1.11"
cpal = "=0.18.2"
parking_lot = "0.12"
local-ip-address = "0.6"
iana-time-zone = "0.1"

igd-next = { version = "0.17", features = ["aio_tokio"] }
iroh = { workspace = true }
natpmp = { version = "0.5", default-features = false, features = ["tokio"] }
reqwest = { workspace = true }
secp256k1 = { workspace = true }
hex = { workspace = true }
bech32 = "0.11"
bip39 = "2"
hmac = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
hkdf = "0.12"
dirs = "5"
rand = "0.8"

base64 = "0.22"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", rev = "d375b2d", default-features = false, features = ["tract", "default-model"] }
# Pinned: DeepFilterNet asks for ^0.21.4 and the model does not load at all on
# a newer tract. See the [profile.dev.package] note in the workspace root.
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
ndarray = "0.15"

rubato = "=5.0.1"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm", "all-meta"] }
# symphonia demuxes Ogg Opus but cannot decode it. A libopus port in Rust, so no
# second C libopus beside libwebrtc's; `opus-decoder` panicked on a real Discord sound.
opus-rs = "0.1.34"

dioxusfun-protocol = { workspace = true }
dioxusfun-server = { workspace = true }
dioxus-grid-layout = { path = "../grid-layout" }

serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
minisign-verify = "0.2.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
scrypt = { version = "0.11", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
zeroize = "1"
unicode-segmentation = "1.13.3"
rfd = { version = "0.17", default-features = false }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:dioxus-desktop"]
devtools = ["dioxus/devtools", "dioxus-desktop?/devtools"]
mobile = ["dioxus/mobile"]
web = ["dioxus/web"]

[[bin]]
name = "Discordia"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows = { version = "0.61", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"
webview2-com-sys = "0.38"

[target.'cfg(not(target_os = "windows"))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = "0.3"
objc2-core-video = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
coreaudio-sys = "0.2"

[package.metadata.cargo-machete]
ignored = ["deep_filter", "tract-core", "tract-onnx", "tract-pulse", "tract-hir", "libwebrtc", "webrtc-sys", "webrtc-sys-build", "livekit-common", "livekit-data-stream", "livekit-protocol", "livekit-datatrack"]

[dev-dependencies]
rubato-legacy = { package = "rubato", version = "=0.16.2" }
axum = { workspace = true }
dioxusfun-rendezvous = { path = "../rendezvous" }
livekit-api = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
webrtc-sys-build = "=0.3.18"
winresource = "0.1"
