allprojects { project ->
    project.plugins.withId('com.android.application') {
        def jar = project.file('libs/libwebrtc.jar')
        if (!jar.isFile()) {
            throw new GradleException('Missing matching libwebrtc.jar; use scripts/build-android.py')
        }
        project.dependencies.add('implementation', project.files(jar))
        project.androidComponents.finalizeDsl { android ->
            android.buildTypes.getByName('debug').applicationIdSuffix = '.debug'
            def versionCode = System.getenv('DISCORDIA_ANDROID_VERSION_CODE')
            if (versionCode != null) {
                if (!(versionCode ==~ /[0-9]+/) || versionCode.toLong() < 1 || versionCode.toLong() > 2100000000L) {
                    throw new GradleException('Invalid Android version code')
                }
                android.defaultConfig.versionCode = versionCode.toInteger()
            }
            def versionName = System.getenv('DISCORDIA_ANDROID_VERSION_NAME')
            if (versionName) android.defaultConfig.versionName = versionName
        }
    }
}
