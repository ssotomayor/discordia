[package]
name = "discordia-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = ["cli"]
# The binary: flags, the config file, `setup`, and the rendezvous as a subcommand.
# The client embeds the library and leaves these out.
cli = ["dep:clap", "dep:toml", "dep:discordia-rendezvous"]

[[bin]]
name = "discordia-server"
path = "src/bin/discordia-server/main.rs"
required-features = ["cli"]

[build-dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dev-dependencies]
discordia-bot = { path = "../bot-sdk" }
tokio = { workspace = true, features = ["full", "test-util"] }
discordia-rendezvous = { path = "../rendezvous" }
tokio-tungstenite = { workspace = true }
serde_json = { workspace = true }

[dependencies]
clap = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
discordia-rendezvous = { path = "../rendezvous", optional = true }
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"] }
# services-tokio is RemoveParticipant: evicting from the SFU, not just asking the app to leave.
livekit-api = { workspace = true, features = ["services-tokio", "rustls-tls-native-roots"] }
iroh = { workspace = true }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# The /sfu proxy dials the bundled SFU as a WebSocket client; the gateway itself speaks axum's.
tokio-tungstenite = { workspace = true }
secp256k1 = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
bs58 = { workspace = true }
flate2 = "1"
rand = "0.8"
local-ip-address = "0.6"

# No `macros` feature on purpose: store.rs builds every statement at runtime,
# so there is no compile-time database to point them at.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
anyhow = "1"

discordia-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
