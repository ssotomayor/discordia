[package]
name = "dioxusfun-server"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[dev-dependencies]
dioxusfun-bot = { path = "../bot-sdk" }
tokio = { workspace = true, features = ["full"] }
dioxusfun-rendezvous = { path = "../rendezvous" }
tokio-tungstenite = { workspace = true }
serde_json = { workspace = true }

[dependencies]
axum = { workspace = true, features = ["macros"] }
tokio = { workspace = true, features = ["full"] }
livekit-api = { version = "0.4", default-features = false, features = ["access-token"] }
iroh = { workspace = true }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
secp256k1 = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"
bs58 = { workspace = true }
rand = "0.8"

# No `macros` feature on purpose: store.rs builds every statement at runtime,
# so there is no compile-time database to point them at.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
base64 = "0.22"
anyhow = "1"

dioxusfun-protocol = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
