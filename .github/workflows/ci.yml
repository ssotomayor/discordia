name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Must match the `dioxus` version in Cargo.lock. Unpinned, binstall takes the
  # newest CLI, which drifts from the crate on every dx release — and dx prints
  # "dx and dioxus versions are incompatible!" and then bundles anyway, so the
  # mismatch reaches a published artifact instead of a red job. Bump this in the
  # same commit that bumps the crate.
  DIOXUS_CLI_VERSION: "0.7.10"
  # LIVEKIT_BUNDLE_SKIP deliberately does NOT live here. It used to, back when
  # this file only ran checks — and then the pre-release jobs were added to it
  # and inherited the skip, so every published binary went out with an empty
  # stub in place of the 51MB livekit-server and could not host voice at all.
  # It is now set per job, on the three that build nothing anyone downloads.

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    # Nothing here is downloaded by anyone, and voice is exercised only in
    # manual runs — so skip the ~50MB fetch. Safe precisely because this job
    # publishes no artifact.
    env:
      LIVEKIT_BUNDLE_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The desktop client needs system GTK/WebKit to compile; CI covers the
      # server-side crates (protocol, server, bot SDK, rendezvous) where all
      # the tests live. The client is checked in the desktop-build job below.
      - name: Format
        run: cargo fmt --all --check

      # --all-targets, not --tests: examples are a build target the tests don't
      # cover, and a dead-code sweep once broke bot-sdk/examples/ping.rs with
      # nothing catching it.
      - name: Clippy (server crates)
        run: cargo clippy -p dioxusfun-protocol -p dioxusfun-server -p dioxusfun-bot -p dioxusfun-rendezvous --all-targets -- -D warnings

      - name: Tests (protocol + server + bot SDK + rendezvous)
        run: cargo test -p dioxusfun-protocol -p dioxusfun-server -p dioxusfun-bot -p dioxusfun-rendezvous

  desktop-build:
    name: client compiles (linux)
    runs-on: ubuntu-latest
    # Compile check only; nothing leaves this job.
    env:
      LIVEKIT_BUNDLE_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System deps (wry/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libasound2-dev libssl-dev pkg-config
      # The remaining two crates, and the only job that can lint them: both
      # need GTK/WebKit, which the `test` job above deliberately does not
      # install. Clippy compiles what it lints, so this is still the compile
      # check this job exists for — one build, not two.
      - name: Clippy (client + grid-layout)
        run: cargo clippy -p dioxusfun -p dioxus-grid-layout --all-targets -- -D warnings

      # Second profile, different lint set: `unused_variables` and friends fire
      # only with `debug_assertions` off, which nothing above compiles — that is
      # how nine of them reached a published build (`c685828`). Costs a second
      # compile, since the flag changes the fingerprint.
      - name: Clippy (release profile)
        env:
          RUSTFLAGS: "-C debug-assertions=off"
        run: cargo clippy -p dioxusfun -p dioxus-grid-layout --all-targets -- -D warnings

  # The Linux job above compiles the client, but never the `#[cfg(target_os =
  # "windows")]` half of it — and the release job that would is gated on `push`,
  # so a pull request can't tell whether the Windows-only code even builds. That
  # code is unsafe FFI against WASAPI, which is precisely the kind that should
  # not reach master on the strength of having been read.
  windows-build:
    name: client compiles (windows)
    runs-on: windows-latest
    env:
      # libwebrtc links the STATIC MSVC runtime (/MT); Rust defaults to /MD and
      # the two collide (LNK2038). Same flag as the release jobs below.
      RUSTFLAGS: "-C target-feature=+crt-static"
      # Compile check only; nothing leaves this job.
      LIVEKIT_BUNDLE_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check client
        run: cargo check -p dioxusfun

  # And the same hole on the other side. `client/src/sysvideo/macos.rs` and
  # `client/src/sysaudio/macos.rs` are unsafe FFI against ScreenCaptureKit and
  # CoreVideo — one of them shipped a double-release of a CVPixelBuffer that
  # trapped inside CFRelease the instant a share started. Neither compiles on
  # Linux or Windows, and the only job that did build them, prerelease-macos,
  # is gated on `push`. So a pull request could not tell whether the macOS half
  # of the client built at all, which is exactly how c1442ab reached master.
  macos-build:
    name: client compiles (macos)
    runs-on: macos-latest
    env:
      # No crt-static here: that flag is an MSVC concern, not a darwin one.
      # Compile check only; nothing leaves this job.
      LIVEKIT_BUNDLE_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check client
        run: cargo check -p dioxusfun

  tailwind:
    name: tailwind css is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npx @tailwindcss/cli` fetches only the CLI binary, but the
      # `@import "tailwindcss"` in assets/tailwind.css has to resolve the
      # `tailwindcss` package itself from the input file's directory — that
      # comes from package.json devDependencies, so install them first.
      - name: Install Node deps
        run: cd client && npm ci

      - name: Regenerate Tailwind CSS
        run: cd client && npx @tailwindcss/cli -i assets/tailwind.css -o assets/tailwind.out.css --minify

      # tailwind.out.css is committed and baked into the binary via
      # include_str!, so Node is never needed to build or run the app — only to
      # regenerate this file. Drift means someone added a utility class without
      # regenerating, and it would silently render unstyled at runtime.
      - name: Committed CSS matches source
        run: git diff --exit-code client/assets/tailwind.out.css

  # Pre-Release: every push to master/main builds Linux/Windows/macOS artifacts
  # and publishes v0.1.0-pre.<run_number>. `if: push` keeps these off
  # pull_request events, where GITHUB_TOKEN can't create releases (PR #13's 403).

  prerelease-linux:
    name: pre-release · server+client (linux · x86_64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (wry/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libasound2-dev libssl-dev pkg-config
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores ~/.cargo metadata, so binstall thinks dx is
      # already installed. GITHUB_TOKEN: anonymous API lookups hit the 60/h
      # per-IP limit and 403 into a source build, which needs --locked to compile.
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli@${{ env.DIOXUS_CLI_VERSION }} --no-confirm --force --locked
      - name: Verify dx
        run: dx --version
      - name: Build server (release)
        run: cargo build --release -p dioxusfun-server
      # The direct assertion, and the only one that does not have to guess a
      # threshold from a compressed container: this binary *is* the embed. It
      # is ~10MB with an empty stub and ~61MB with the real thing, so 40MB has
      # room on both sides, and it is the same number on all three platforms.
      # Runs before `strip` so nothing depends on which sections strip keeps.
      #
      # It also covers the published `dioxusfun-server-*` assets, which are
      # release artifacts in their own right (rung 2/3 of SELF_HOSTING.md) and
      # which no size check reached before.
      - name: Verify livekit-server is embedded
        shell: pwsh
        run: |
          $srv = Get-Item target/release/dioxusfun-server
          if ($srv.Length -lt 40MB) { throw "dioxusfun-server is $($srv.Length) bytes - the ~51MB bundled livekit-server is missing; refusing to publish it" }
      - name: Strip server binary
        run: strip target/release/dioxusfun-server
      - name: Bundle client (AppImage)
        working-directory: client
        run: dx bundle --release
      - name: Collect artifacts
        shell: pwsh
        run: |
          $appimg = Get-ChildItem -Recurse -Filter '*.AppImage' target/dx | Select-Object -First 1
          if (-not $appimg) { throw "no AppImage produced by dx bundle" }
          # No size floor here on purpose. The broken AppImage published as
          # v0.1.0-pre.125 was 116,663,488 bytes — a floor reasoned across from
          # the Windows numbers would have been inert, because the AppImage
          # carries a GTK/WebKit payload the exe does not. A floor that would
          # actually fire has to come from measuring a real bundled build, and
          # there has never been one. The check on `dioxusfun-server` above is
          # the direct assertion and needs no such number.
          Copy-Item $appimg.FullName Discordia-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-linux
          path: |
            target/release/dioxusfun-server
            Discordia-linux-x86_64.AppImage
          retention-days: 7

  prerelease-windows:
    name: pre-release · server+client (windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      # libwebrtc links the STATIC MSVC runtime (/MT); Rust defaults to /MD and
      # the two collide (LNK2038). Same flag as windows-release.yml.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli@${{ env.DIOXUS_CLI_VERSION }} --no-confirm --force --locked
      - name: Verify dx
        run: dx --version
      - name: Build server (release)
        run: cargo build --release -p dioxusfun-server
      # See the linux job — same check, same number.
      - name: Verify livekit-server is embedded
        shell: pwsh
        run: |
          $srv = Get-Item target/release/dioxusfun-server.exe
          if ($srv.Length -lt 40MB) { throw "dioxusfun-server.exe is $($srv.Length) bytes - the ~51MB bundled livekit-server is missing; refusing to publish it" }
      # One download, two artifacts — see windows-release.yml for the reasoning.
      - name: Fetch WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          $dest = 'client/nsis/MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $dest
          $size = (Get-Item $dest).Length
          if ($size -lt 500KB -or $size -gt 20MB) { throw "unexpected bootstrapper size ($size bytes) - refusing to ship it" }
      - name: Bundle client
        working-directory: client
        run: dx bundle --release
      # dx emits the app three times (standalone exe, NSIS installer, and the
      # installer's staging copy). Ship a portable zip (exe + the assets that
      # live beside it, not embedded) and the installer, not the whole tree.
      #
      # The portable has no installer to run the WebView2 stub for it, so it
      # carries the bootstrapper `dx bundle` already fetched into ~/.dx/tools
      # for the setup — copied, not re-downloaded, so both ship the same file.
      - name: Package client artifacts
        shell: pwsh
        run: |
          $root = Get-ChildItem -Recurse -Directory target/dx |
                  Where-Object { $_.Name -eq 'windows' } | Select-Object -First 1
          if (-not $root) { throw "no windows bundle output found under target/dx" }

          # The one artifact-level floor kept, because it is the only one with a
          # measurement on both sides: 74,465,280 bytes broken against
          # 125,901,312 fixed, so 100MB sits between them with room to spare.
          # It guards something the server-binary check cannot — the *client*
          # embeds its own copy, and this is the binary users actually run.
          $exe = Get-Item "$($root.FullName)/Discordia.exe"
          if ($exe.Length -lt 100MB) { throw "Discordia.exe is $($exe.Length) bytes - too small to contain the bundled livekit-server; refusing to publish it" }

          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "$($root.FullName)/Discordia.exe" portable/
          $assets = Join-Path $root.FullName 'nsis/_staging/assets'
          if (Test-Path $assets) { Copy-Item $assets portable/assets -Recurse }

          # The same file the NSIS hook embedded.
          Copy-Item client/nsis/MicrosoftEdgeWebview2Setup.exe portable/
          Copy-Item .github/portable/WEBVIEW2.txt portable/

          Compress-Archive -Path portable/* -DestinationPath Discordia-windows-portable.zip

          $setup = Get-ChildItem -Recurse -Filter '*-setup.exe' $root.FullName | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName Discordia-windows-setup.exe }

          # Fail loudly if the offline runtime ever creeps back in.
          $tools = Join-Path $env:USERPROFILE '.dx/tools'
          if (Test-Path $tools) {
            if (Get-ChildItem $tools -Filter 'MicrosoftEdgeWebView2RuntimeInstaller_*.exe') {
              throw "offline WebView2 runtime was downloaded - webview_install_mode regressed away from Skip"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-windows
          path: |
            target/release/dioxusfun-server.exe
            Discordia-windows-portable.zip
            Discordia-windows-setup.exe
          retention-days: 7

  prerelease-macos:
    name: pre-release · server+client (macos · arm64)
    if: github.event_name == 'push'
    runs-on: macos-latest           # macOS 14 = Apple Silicon (M1)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      # LiveKit publishes no darwin binaries, so `server/build.rs` clones the
      # repo and `go build`s it here. The runner image happens to carry Go, but
      # as a *cached tool* — which is a promise about the image, not about PATH,
      # and now that a missing bundle fails the build instead of warning, that
      # difference is the difference between a release and a red job. Pin it.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify go
        run: go version
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli@${{ env.DIOXUS_CLI_VERSION }} --no-confirm --force --locked
      - name: Verify dx
        run: dx --version
      - name: Build server (release)
        run: cargo build --release -p dioxusfun-server
      # See the linux job — same check, same number. Worth the most here: this
      # is the platform that builds livekit-server from source with `go`, so it
      # has a way to come up empty that a failed download does not cover.
      - name: Verify livekit-server is embedded
        shell: pwsh
        run: |
          $srv = Get-Item target/release/dioxusfun-server
          if ($srv.Length -lt 40MB) { throw "dioxusfun-server is $($srv.Length) bytes - the ~51MB bundled livekit-server is missing; refusing to publish it" }
      - name: Bundle client
        working-directory: client
        run: dx bundle --release
      - name: Collect client artifacts
        shell: pwsh
        run: |
          $root = Get-ChildItem -Recurse -Directory target/dx |
                  Where-Object { $_.Name -eq 'macos' } | Select-Object -First 1
          if (-not $root) { throw "no macos bundle output found under target/dx" }

          $dmg = Get-ChildItem -Recurse -Filter '*.dmg' $root.FullName | Select-Object -First 1
          if (-not $dmg) { throw "no .dmg produced by dx bundle" }
          # No size floor here either, and this one was worse than inert. The
          # broken dmg was 35,017,024 bytes; scaling by the uncompressed growth
          # measured on Windows (×1.69) projects ~56.5MB for a *fixed* one —
          # under the 60MB floor this used to carry. `publish-prerelease` needs
          # all three jobs, so a false positive here would have stopped every
          # pre-release, and only once the release actually worked. UDZO on a Go
          # binary is not the Windows ratio, which is the point: the number was
          # extrapolated, and the check above does not need one.
          Copy-Item $dmg.FullName Discordia-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-macos
          path: |
            target/release/dioxusfun-server
            Discordia-macos-arm64.dmg
          retention-days: 7

  publish-prerelease:
    name: Publish pre-release
    if: github.event_name == 'push'
    needs: [test, desktop-build, prerelease-linux, prerelease-windows, prerelease-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # create the release + tag
      pull-requests: read       # generate_release_notes reads merged PRs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release artifacts
        run: |
          mkdir -p release
          # find, not fixed paths: upload-artifact@v4 keeps the least-common-
          # ancestor structure, so the server binaries land nested under
          # target/release/ inside the downloaded artifact.
          find artifacts/prerelease-linux -type f -name dioxusfun-server \
            -exec cp {} release/dioxusfun-server-linux \;
          find artifacts/prerelease-linux -type f -name '*.AppImage' \
            -exec cp {} release/ \;
          find artifacts/prerelease-windows -type f -name dioxusfun-server.exe \
            -exec cp {} release/ \;
          find artifacts/prerelease-windows -type f -name 'Discordia-windows-portable.zip' \
            -exec cp {} release/ \;
          find artifacts/prerelease-windows -type f -name 'Discordia-windows-setup.exe' \
            -exec cp {} release/ \;
          find artifacts/prerelease-macos -type f -name dioxusfun-server \
            -exec cp {} release/dioxusfun-server-macos \;
          find artifacts/prerelease-macos -type f -name 'Discordia-macos-arm64.dmg' \
            -exec cp {} release/ \;
          ls -l release/
          test "$(find release -type f | wc -l)" -eq 7 || { echo "ERROR: expected 7 artifacts"; exit 1; }
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-pre.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pre-Release v0.1.0-pre.${{ github.run_number }}
          prerelease: true
          draft: false
          make_latest: "false"
          generate_release_notes: true
          files: release/*