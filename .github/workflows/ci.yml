name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI never needs the bundled LiveKit binary (voice is exercised only in
  # manual runs); skipping saves a ~50MB download per job.
  LIVEKIT_BUNDLE_SKIP: "1"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The desktop client needs system GTK/WebKit to compile; CI covers the
      # server-side crates (protocol, server, bot SDK) where all the tests
      # live. The client is checked in the desktop-build job below.
      - name: Format
        run: cargo fmt --all --check
        continue-on-error: true # not yet formatted repo-wide; informational

      - name: Clippy (server crates)
        run: cargo clippy -p dioxusfun-protocol -p dioxusfun-server -p dioxusfun-bot --tests -- -D warnings
        continue-on-error: true # informational until the lint debt is paid

      - name: Tests (protocol + server + bot SDK)
        run: cargo test -p dioxusfun-protocol -p dioxusfun-server -p dioxusfun-bot

  desktop-build:
    name: client compiles (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (wry/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libasound2-dev libssl-dev pkg-config
      - name: Check client
        run: cargo check -p dioxusfun

  tailwind:
    name: tailwind css is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npx @tailwindcss/cli` fetches only the CLI binary, but the
      # `@import "tailwindcss"` in assets/tailwind.css has to resolve the
      # `tailwindcss` package itself from the input file's directory — that
      # comes from package.json devDependencies, so install them first.
      - name: Install Node deps
        run: cd client && npm ci

      - name: Regenerate Tailwind CSS
        run: cd client && npx @tailwindcss/cli -i assets/tailwind.css -o assets/tailwind.out.css --minify

      # tailwind.out.css is committed and baked into the binary via
      # include_str!, so Node is never needed to build or run the app — only to
      # regenerate this file. Drift means someone added a utility class without
      # regenerating, and it would silently render unstyled at runtime.
      - name: Committed CSS matches source
        run: git diff --exit-code client/assets/tailwind.out.css

  # ─────────────────────────────────────────────────────────────────────
  # Pre-Release: on every push to master/main, build distributable
  # artifacts for all three platforms (Linux, Windows, macOS) and publish a
  # GitHub Pre-Release tagged v0.1.0-pre.<run_number>.
  # `publish-prerelease` depends on the whole CI suite passing first, so a
  # broken merge never produces a downloadable release.
  #
  # Gated with `if: github.event_name == 'push'` so pre-release builds
  # and publication only run on push to master/main, never on pull_request
  # events (where the GITHUB_TOKEN has restricted permissions and can't
  # create releases — the 403 we hit on PR #13).
  #
  # Artifacts per platform:
  #   Linux   → dioxusfun-server (binary) + Discordia-linux-x86_64.AppImage
  #   Windows → dioxusfun-server.exe + Discordia-windows-portable.zip + -setup.exe
  #   macOS   → dioxusfun-server (binary) + Discordia-macos-arm64.dmg
  # ─────────────────────────────────────────────────────────────────────

  prerelease-linux:
    name: pre-release · server+client (linux · x86_64)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      LIVEKIT_BUNDLE_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # wry/GTK headers — necesarios para compilar el cliente (igual que desktop-build)
      - name: System deps (wry/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libasound2-dev libssl-dev pkg-config
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restaura ~/.cargo metadata, así que binstall ve
      # dioxus-cli como "already installed" y lo salta — mientras el dx real
      # no está en el cache restaurado.
      #
      # GITHUB_TOKEN: binstall consulta la GitHub API para localizar el `dx`
      # precompilado. Sin token va anónimo (60 req/h compartidos por IP del
      # runner) y devuelve 403 → binstall cae a `cargo install` desde fuente,
      # que rompe (ver nota de --locked). Autenticado son 5000 req/h.
      #
      # --locked: si aun así toca compilar, usa el Cargo.lock publicado de
      # dioxus-cli. Sin él cargo re-resuelve a lo último semver-compatible y
      # auth-git2 no compila contra el git2 nuevo (E0599 credential_helper).
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli --no-confirm --force --locked
      - name: Verify dx
        run: dx --version
      - name: Build server (release)
        run: cargo build --release -p dioxusfun-server
      - name: Strip server binary
        run: strip target/release/dioxusfun-server
      # dx bundle en Linux produce AppImage por defecto. No necesita FUSE en
      # CI: dx setea APPIMAGE_EXTRACT_AND_RUN=1 y auto-descarga linuxdeploy.
      - name: Bundle client (AppImage)
        working-directory: client
        run: dx bundle --release
      # El nombre del AppImage incluye versión+arch: Discordia_0.1.0_x86_64.AppImage
      - name: Collect artifacts
        shell: pwsh
        run: |
          $appimg = Get-ChildItem -Recurse -Filter '*.AppImage' target/dx | Select-Object -First 1
          if (-not $appimg) { throw "no AppImage produced by dx bundle" }
          Copy-Item $appimg.FullName Discordia-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-linux
          path: |
            target/release/dioxusfun-server
            Discordia-linux-x86_64.AppImage
          retention-days: 7

  prerelease-windows:
    name: pre-release · server+client (windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # LiveKit's prebuilt libwebrtc links the STATIC MSVC runtime (/MT);
      # Rust defaults to /MD, so both C++ runtimes collide (LNK2038). Match
      # libwebrtc by making Rust use the static CRT too. Same flag as
      # windows-release.yml and .cargo/config.toml.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      # Ver la nota extensa en prerelease-linux: --force por el rust-cache,
      # GITHUB_TOKEN para no comerse el 403 anónimo de la GitHub API, y
      # --locked para que el fallback a compilación desde fuente no rompa.
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli --no-confirm --force --locked
      - name: Verify dx
        run: dx --version
      - name: Build server (release)
        env:
          LIVEKIT_BUNDLE_SKIP: "1"
        run: cargo build --release -p dioxusfun-server
      - name: Bundle client
        working-directory: client
        run: dx bundle --release
      # dx emits the app three times (standalone exe, NSIS installer, and
      # the installer's staging copy). Publish two lean things instead of
      # zipping the whole tree: a portable zip (exe + its assets, which live
      # beside the exe — not embedded in it) and the installer on its own.
      # Same packaging logic as windows-release.yml.
      - name: Package client artifacts
        shell: pwsh
        run: |
          $root = Get-ChildItem -Recurse -Directory target/dx |
                  Where-Object { $_.Name -eq 'windows' } | Select-Object -First 1
          if (-not $root) { throw "no windows bundle output found under target/dx" }

          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "$($root.FullName)/Discordia.exe" portable/
          $assets = Join-Path $root.FullName 'nsis/_staging/assets'
          if (Test-Path $assets) { Copy-Item $assets portable/assets -Recurse }
          Compress-Archive -Path portable/* -DestinationPath Discordia-windows-portable.zip

          $setup = Get-ChildItem -Recurse -Filter '*-setup.exe' $root.FullName | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName Discordia-windows-setup.exe }
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-windows
          path: |
            target/release/dioxusfun-server.exe
            Discordia-windows-portable.zip
            Discordia-windows-setup.exe
          retention-days: 7

  prerelease-macos:
    name: pre-release · server+client (macos · arm64)
    if: github.event_name == 'push'
    runs-on: macos-latest           # macOS 14 = Apple Silicon (M1)
    env:
      CARGO_TERM_COLOR: always
      # -ObjC es requerido por libwebrtc; ya está en .cargo/config.toml para
      # aarch64-apple-darwin, se aplica automáticamente. No hay que setearlo aquí.
      LIVEKIT_BUNDLE_SKIP: "1"      # evita clone + go build de LiveKit (~3 min)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      # Ver la nota extensa en prerelease-linux. Este es el job que falló en la
      # run 31195906555: 403 de la GitHub API → fallback a fuente → E0599 en
      # auth-git2. GITHUB_TOKEN evita el 403; --locked salva el fallback.
      - name: Install Dioxus CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall dioxus-cli --no-confirm --force --locked
      - name: Verify dx
        run: dx --version
      - name: Build server (release)
        env:
          LIVEKIT_BUNDLE_SKIP: "1"
        run: cargo build --release -p dioxusfun-server
      - name: Bundle client
        working-directory: client
        run: dx bundle --release
      # dx bundle en macOS genera:
      #   target/dx/macos/Discordia.app   (bundle)
      #   target/dx/macos/*.dmg           (instalador)
      - name: Collect client artifacts
        shell: pwsh
        run: |
          $root = Get-ChildItem -Recurse -Directory target/dx |
                  Where-Object { $_.Name -eq 'macos' } | Select-Object -First 1
          if (-not $root) { throw "no macos bundle output found under target/dx" }

          $dmg = Get-ChildItem -Recurse -Filter '*.dmg' $root.FullName | Select-Object -First 1
          if (-not $dmg) { throw "no .dmg produced by dx bundle" }
          Copy-Item $dmg.FullName Discordia-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-macos
          path: |
            target/release/dioxusfun-server
            Discordia-macos-arm64.dmg
          retention-days: 7

  publish-prerelease:
    name: Publish pre-release
    if: github.event_name == 'push'
    needs: [test, desktop-build, prerelease-linux, prerelease-windows, prerelease-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # crear el release + tag
      pull-requests: read       # generate_release_notes: true → lee PRs mergeados
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release artifacts
        run: |
          mkdir -p release
          # find (no cp con paths fijos): upload-artifact@v4 preserva la
          # estructura del least-common-ancestor, así que los binarios del
          # server quedan anidados bajo target/release/ dentro del artefacto
          # descargado. find los localiza sin importar la profundidad.
          # Linux
          find artifacts/prerelease-linux -type f -name dioxusfun-server \
            -exec cp {} release/dioxusfun-server-linux \;
          find artifacts/prerelease-linux -type f -name '*.AppImage' \
            -exec cp {} release/ \;
          # Windows
          find artifacts/prerelease-windows -type f -name dioxusfun-server.exe \
            -exec cp {} release/ \;
          find artifacts/prerelease-windows -type f -name 'Discordia-windows-portable.zip' \
            -exec cp {} release/ \;
          find artifacts/prerelease-windows -type f -name 'Discordia-windows-setup.exe' \
            -exec cp {} release/ \;
          # macOS
          find artifacts/prerelease-macos -type f -name dioxusfun-server \
            -exec cp {} release/dioxusfun-server-macos \;
          find artifacts/prerelease-macos -type f -name 'Discordia-macos-arm64.dmg' \
            -exec cp {} release/ \;
          # Verificar que los 7 artefactos están presentes
          ls -l release/
          test "$(find release -type f | wc -l)" -eq 7 || { echo "ERROR: expected 7 artifacts"; exit 1; }
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-pre.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pre-Release v0.1.0-pre.${{ github.run_number }}
          prerelease: true
          draft: false
          make_latest: "false"
          generate_release_notes: true
          files: release/*