name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI never needs the bundled LiveKit binary (voice is exercised only in
  # manual runs); skipping saves a ~50MB download per job.
  LIVEKIT_BUNDLE_SKIP: "1"

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The desktop client needs system GTK/WebKit to compile; CI covers the
      # server-side crates (protocol, server, bot SDK) where all the tests
      # live. The client is checked in the desktop-build job below.
      - name: Format
        run: cargo fmt --all --check
        continue-on-error: true # not yet formatted repo-wide; informational

      - name: Clippy (server crates)
        run: cargo clippy -p dioxusfun-protocol -p dioxusfun-server -p dioxusfun-bot --tests -- -D warnings
        continue-on-error: true # informational until the lint debt is paid

      - name: Tests (protocol + server + bot SDK)
        run: cargo test -p dioxusfun-protocol -p dioxusfun-server -p dioxusfun-bot

  desktop-build:
    name: client compiles (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (wry/GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libasound2-dev libssl-dev pkg-config
      - name: Check client
        run: cargo check -p dioxusfun

  tailwind:
    name: tailwind css is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # `npx @tailwindcss/cli` fetches only the CLI binary, but the
      # `@import "tailwindcss"` in assets/tailwind.css has to resolve the
      # `tailwindcss` package itself from the input file's directory — that
      # comes from package.json devDependencies, so install them first.
      - name: Install Node deps
        run: cd client && npm ci

      - name: Regenerate Tailwind CSS
        run: cd client && npx @tailwindcss/cli -i assets/tailwind.css -o assets/tailwind.out.css --minify

      # tailwind.out.css is committed and baked into the binary via
      # include_str!, so Node is never needed to build or run the app — only to
      # regenerate this file. Drift means someone added a utility class without
      # regenerating, and it would silently render unstyled at runtime.
      - name: Committed CSS matches source
        run: git diff --exit-code client/assets/tailwind.out.css

  # ─────────────────────────────────────────────────────────────────────
  # Pre-Release: on every push to master/main, build distributable
  # artifacts (Linux server, Windows server, Windows client bundle) and
  # publish a GitHub Pre-Release tagged v0.1.0-pre.<run_number>.
  # `publish-prerelease` depends on the whole CI suite passing first, so a
  # broken merge never produces a downloadable release.
  # ─────────────────────────────────────────────────────────────────────

  prerelease-linux:
    name: pre-release · server (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server (release)
        env:
          LIVEKIT_BUNDLE_SKIP: "1"
        run: cargo build --release -p dioxusfun-server
      - name: Strip binary
        run: strip target/release/dioxusfun-server
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-server-linux
          path: target/release/dioxusfun-server
          retention-days: 7

  prerelease-windows:
    name: pre-release · server+client (windows)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
      # LiveKit's prebuilt libwebrtc links the STATIC MSVC runtime (/MT);
      # Rust defaults to /MD, so both C++ runtimes collide (LNK2038). Match
      # libwebrtc by making Rust use the static CRT too. Same flag as
      # windows-release.yml.
      RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      # --force: rust-cache restores ~/.cargo metadata, so binstall sees
      # dioxus-cli as "already installed" and skips it — while the actual
      # dx.exe isn't in the restored cache.
      - name: Install Dioxus CLI
        run: cargo binstall dioxus-cli --no-confirm --force
      - name: Build server (release)
        env:
          LIVEKIT_BUNDLE_SKIP: "1"
        run: cargo build --release -p dioxusfun-server
      - name: Bundle client
        working-directory: client
        run: dx bundle --release
      # dx emits the app three times (standalone exe, NSIS installer, and
      # the installer's staging copy). Publish two lean things instead of
      # zipping the whole tree: a portable zip (exe + its assets, which live
      # beside the exe — not embedded in it) and the installer on its own.
      # Same packaging logic as windows-release.yml.
      - name: Package client artifacts
        shell: pwsh
        run: |
          $root = Get-ChildItem -Recurse -Directory target/dx |
                  Where-Object { $_.Name -eq 'windows' } | Select-Object -First 1
          if (-not $root) { throw "no windows bundle output found under target/dx" }

          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Copy-Item "$($root.FullName)/Discordia.exe" portable/
          $assets = Join-Path $root.FullName 'nsis/_staging/assets'
          if (Test-Path $assets) { Copy-Item $assets portable/assets -Recurse }
          Compress-Archive -Path portable/* -DestinationPath Discordia-windows-portable.zip

          $setup = Get-ChildItem -Recurse -Filter '*-setup.exe' $root.FullName | Select-Object -First 1
          if ($setup) { Copy-Item $setup.FullName Discordia-windows-setup.exe }
      - uses: actions/upload-artifact@v4
        with:
          name: prerelease-windows
          path: |
            target/release/dioxusfun-server.exe
            Discordia-windows-portable.zip
            Discordia-windows-setup.exe
          retention-days: 7

  publish-prerelease:
    name: Publish pre-release
    needs: [test, desktop-build, prerelease-linux, prerelease-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # required by softprops/action-gh-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name 'dioxusfun-server' -o \
            -name 'dioxusfun-server.exe' -o \
            -name 'Discordia-windows-portable.zip' -o \
            -name 'Discordia-windows-setup.exe' \) \
            -exec cp {} release/ \;
          ls -l release/
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-pre.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Pre-Release v0.1.0-pre.${{ github.run_number }}
          prerelease: true
          draft: false
          make_latest: "false"
          generate_release_notes: true
          files: release/*