
services:
  discordia:
    build: .
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001/udp"
    environment:
      DIOXUSFUN_ADDR: 0.0.0.0:9000
      DIOXUSFUN_QUIC_PORT: 9001
      DIOXUSFUN_DATA_DIR: /data
      DIOXUSFUN_PUBLIC_HOSTS: ${DIOXUSFUN_PUBLIC_HOSTS:-}
      DIOXUSFUN_RELAY_URL: ${DIOXUSFUN_RELAY_URL:-}
      DIOXUSFUN_MEDIA_MAX_BYTES: ${DIOXUSFUN_MEDIA_MAX_BYTES:-}
      DIOXUSFUN_ICE_SERVERS: ${DIOXUSFUN_ICE_SERVERS:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      DIOXUSFUN_OPERATORS: ${DIOXUSFUN_OPERATORS:-}
    volumes:
      - discordia-data:/data

  rendezvous:
    build:
      context: .
      dockerfile: Dockerfile.rendezvous
    restart: unless-stopped
    ports:
      - "7700:7700"
      - "7701:7701"
      - "7702:7702/udp"
      - "${DIOXUSFUN_RENDEZVOUS_TURN_PORTS:-7710-7809}:${DIOXUSFUN_RENDEZVOUS_TURN_PORTS:-7710-7809}/udp"
    environment:
      DIOXUSFUN_RENDEZVOUS_ADDR: 0.0.0.0:7700
      DIOXUSFUN_RENDEZVOUS_DATA_DIR: /data
      DIOXUSFUN_RENDEZVOUS_RELAY_URL: ${DIOXUSFUN_RENDEZVOUS_RELAY_URL:-http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7701}
      DIOXUSFUN_RENDEZVOUS_RELAY_ADDR: 0.0.0.0:7701
      DIOXUSFUN_RENDEZVOUS_TURN_URL: ${DIOXUSFUN_RENDEZVOUS_TURN_URL:-turn:${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7702?transport=udp}
      DIOXUSFUN_RENDEZVOUS_TURN_ADDR: 0.0.0.0:7702
      DIOXUSFUN_RENDEZVOUS_TURN_PORTS: ${DIOXUSFUN_RENDEZVOUS_TURN_PORTS:-7710-7809}
      DIOXUSFUN_RENDEZVOUS_TURN_RELAY_IP: ${DIOXUSFUN_RENDEZVOUS_TURN_RELAY_IP:-}
      DIOXUSFUN_RENDEZVOUS_TURN_SECRET: ${DIOXUSFUN_RENDEZVOUS_TURN_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
    volumes:
      - rendezvous-data:/data

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  discordia-data:
  rendezvous-data:
