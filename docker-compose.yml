
services:
  discordia:
    build: .
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001/udp"
    environment:
      DISCORDIA_ADDR: 0.0.0.0:9000
      DISCORDIA_QUIC_PORT: 9001
      DISCORDIA_DATA_DIR: /data
      DISCORDIA_PUBLIC_HOSTS: ${DISCORDIA_PUBLIC_HOSTS:-}
      DISCORDIA_TRUSTED_PROXIES: ${DISCORDIA_TRUSTED_PROXIES:-}
      DISCORDIA_RELAY_URL: ${DISCORDIA_RELAY_URL:-}
      DISCORDIA_MEDIA_MAX_BYTES: ${DISCORDIA_MEDIA_MAX_BYTES:-}
      DISCORDIA_ICE_SERVERS: ${DISCORDIA_ICE_SERVERS:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      DISCORDIA_OPERATORS: ${DISCORDIA_OPERATORS:-}
    volumes:
      - discordia-data:/data

  rendezvous:
    build:
      context: .
      dockerfile: Dockerfile.rendezvous
    restart: unless-stopped
    ports:
      - "7700:7700"
      - "7701:7701"
      - "7702:7702/udp"
      - "${DISCORDIA_RENDEZVOUS_TURN_PORTS:-7710-7809}:${DISCORDIA_RENDEZVOUS_TURN_PORTS:-7710-7809}/udp"
    environment:
      DISCORDIA_RENDEZVOUS_ADDR: 0.0.0.0:7700
      DISCORDIA_RENDEZVOUS_DATA_DIR: /data
      DISCORDIA_RENDEZVOUS_PUBLIC_HOSTS: ${DISCORDIA_RENDEZVOUS_PUBLIC_HOSTS:-${PUBLIC_HOST:?set PUBLIC_HOST in .env}}
      DISCORDIA_RENDEZVOUS_RELAY_URL: ${DISCORDIA_RENDEZVOUS_RELAY_URL:-http://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7701}
      DISCORDIA_RENDEZVOUS_RELAY_ADDR: 0.0.0.0:7701
      DISCORDIA_RENDEZVOUS_TURN_URL: ${DISCORDIA_RENDEZVOUS_TURN_URL:-turn:${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7702?transport=udp}
      DISCORDIA_RENDEZVOUS_TURN_ADDR: 0.0.0.0:7702
      DISCORDIA_RENDEZVOUS_TURN_PORTS: ${DISCORDIA_RENDEZVOUS_TURN_PORTS:-7710-7809}
      DISCORDIA_RENDEZVOUS_TURN_RELAY_IP: ${DISCORDIA_RENDEZVOUS_TURN_RELAY_IP:-}
      DISCORDIA_RENDEZVOUS_TURN_SECRET: ${DISCORDIA_RENDEZVOUS_TURN_SECRET:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://${PUBLIC_HOST:?set PUBLIC_HOST in .env}:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
    volumes:
      - rendezvous-data:/data

  push-relay:
    build:
      context: .
      dockerfile: Dockerfile.push-relay
    restart: unless-stopped
    # Loopback only: trusting the bridge gateway's X-Forwarded-For is safe only while
    # nothing but nginx on this host can reach 7720.
    ports:
      - "127.0.0.1:7720:7720"
    environment:
      DISCORDIA_PUSH_ADDR: 0.0.0.0:7720
      DISCORDIA_PUSH_DATA_DIR: /data
      DISCORDIA_PUSH_PUBLIC_HOSTS: ${DISCORDIA_PUSH_PUBLIC_HOSTS:-}
      DISCORDIA_PUSH_TRUSTED_PROXIES: ${DISCORDIA_PUSH_TRUSTED_PROXIES:-}
      DISCORDIA_PUSH_FCM_CREDENTIALS: ${DISCORDIA_PUSH_FCM_CREDENTIALS:+/run/secrets/fcm-service-account.json}
      DISCORDIA_PUSH_DM_RELAYS: ${DISCORDIA_PUSH_DM_RELAYS:-}
    volumes:
      - push-relay-data:/data
      # A host path in .env; unset mounts nothing real and the relay only logs its sends.
      - ${DISCORDIA_PUSH_FCM_CREDENTIALS:-/dev/null}:/run/secrets/fcm-service-account.json:ro

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  discordia-data:
  rendezvous-data:
  push-relay-data:
