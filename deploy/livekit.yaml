# LiveKit SFU config for an internet-facing deployment.
#
# The critical line is `use_external_ip: true`: LiveKit must advertise the
# machine's PUBLIC address in its ICE candidates. With it off (the default in
# our bundled LAN config) it advertises a private address, clients connect to
# signalling fine, then silently fail to exchange media.
port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true
# No `keys:` here on purpose: LIVEKIT_KEYS in docker-compose.yml supplies them, so a
# copied file never carries a secret and a missing .env fails the SFU at start.
logging:
  level: info
