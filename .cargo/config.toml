# libwebrtc (via the livekit crate / webrtc-sys) defines ObjC categories on
# NSString that the runtime looks up by selector. Without `-ObjC`, Apple's
# linker strips them as "unused" and PeerConnectionFactory creation aborts
# with `unrecognized selector +[NSString stringForAbslStringView:]`.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-ObjC"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]