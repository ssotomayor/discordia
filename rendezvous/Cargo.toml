[package]
name = "dioxusfun-rendezvous"
version = "0.1.0"
edition = "2024"

[dependencies]
# Rendezvous-specific.
rand = "0.8"
# Minting LiveKit access tokens for hosts that use our shared SFU (the secret
# never leaves this process).
livekit-api = { version = "0.4", default-features = false, features = ["access-token"] }
# Ownership proof for claimed names: Schnorr (BIP-340 / Nostr), same scheme as
# the server's Identify handshake.
secp256k1 = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
bs58 = { workspace = true }

# Shared deps inherited from workspace.
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio-tungstenite = { workspace = true }
secp256k1 = { workspace = true }
