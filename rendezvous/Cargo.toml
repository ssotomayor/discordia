[package]
name = "dioxusfun-rendezvous"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
livekit-api = { workspace = true, features = ["services-tokio", "rustls-tls-native-roots"] }
secp256k1 = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
bs58 = { workspace = true }

dioxusfun-protocol = { workspace = true }
iroh-relay = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
turn = "0.17"
util = { package = "webrtc-util", version = "0.17", default-features = false, features = ["conn", "vnet"] }

[dev-dependencies]
iroh = { workspace = true }
tokio-tungstenite = { workspace = true }
secp256k1 = { workspace = true }
reqwest = { workspace = true }
